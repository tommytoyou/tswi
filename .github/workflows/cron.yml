name: TSWI cron
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  check-alerts:
    runs-on: ubuntu-latest
    steps:
      - run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://www.tswi.us/api/cron/check-alerts)
          echo "check-alerts $code"; test "$code" = "200"
  data-ingestion:
    runs-on: ubuntu-latest
    steps:
      - run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://www.tswi.us/api/cron/data-ingestion)
          echo "data-ingestion $code"; test "$code" = "200"
